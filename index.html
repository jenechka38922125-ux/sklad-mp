<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>E-COM ПФЦ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/sklad-mp/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E-COM ПФЦ">
  <link rel="apple-touch-icon" href="/sklad-mp/icon.png">

  <style>
    :root {
      --primary: #1a73e8; --primary-hover: #1557b0;
      --success: #107c41; --success-hover: #0b5a2f;
      --danger: #dc3545; --danger-hover: #c82333;
      --warning: #f2994a; --bg: #f4f6f9; --card-bg: #ffffff;
      --text: #1e293b; --text-muted: #64748b; --border: #cbd5e1; --selected-bg: #e8f0fe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 0; /* Убран отступ, создававший рамку */
      margin: 0;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    }
    .container { 
      width: 100%; 
      max-width: 900px; 
      background: var(--card-bg); 
      border-radius: 12px; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.08); 
      overflow: hidden; 
      margin-bottom: 30px; 
      display: none;
      /* Защита от закругленных углов и "челки" iPhone */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    /* Универсальный баннер установки (виден всегда вверху) */
    .pwa-top-bar {
      width: 100%; max-width: 900px; background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 10000;
    }
    .pwa-top-bar span { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-install-pwa {
      background: #ffffff; color: #1a73e8; border: none; padding: 7px 14px;
      border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s;
    }
    .btn-install-pwa:hover { background: #f1f5f9; }

    /* Авторизация */
    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
    .auth-card { background: #fff; width: 100%; max-width: 360px; border-radius: 14px; padding: 26px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    .auth-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .auth-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
    .pin-input { font-size: 26px; letter-spacing: 12px; text-align: center; font-weight: 800; width: 180px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; outline: none; margin: 0 auto 16px; display: block; }
    .pin-input:focus { border-color: var(--primary); }

    .user-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 14px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
    .btn-logout { background: none; border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer; color: #5f6368; font-weight: 600; }

    /* УРОВЕНЬ 1: Главные модули */
    .module-nav { display: flex; background: #0f172a; padding: 4px; gap: 4px; }
    .module-btn { flex: 1; text-align: center; padding: 12px 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: #94a3b8; border: none; background: transparent; border-radius: 8px; transition: 0.2s; }
    .module-btn.active { background: #1e293b; color: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

    /* УРОВЕНЬ 2: Подвкладки */
    .sub-nav-tabs { display: flex; background: #e2e8f0; border-bottom: 2px solid var(--border); overflow-x: auto; }
    .sub-nav-tab { flex: 1; min-width: 110px; text-align: center; padding: 11px 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; white-space: nowrap; }
    .sub-nav-tab.active { background: var(--card-bg); color: var(--primary); border-bottom-color: var(--primary); }
    
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #334155; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
      width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; outline: none; background-color: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    
    .table-buttons-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
    .btn-toggle { padding: 8px 0; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background-color: #f8fafc; color: #333; border-radius: 6px; cursor: pointer; text-align: center; }
    .btn-toggle.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }

    .btn { padding: 10px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background-color: var(--success); color: white; }
    .btn-blue { background-color: var(--primary); color: white; }
    .btn-secondary { background-color: var(--danger); color: white; }

    .filter-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .table-container { overflow-x: auto; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); max-height: 420px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f1f5f9; color: #475569; font-weight: 600; position: sticky; top: 0; z-index: 2; }
    tr:hover { background: #f8fafc; }
    .badge-count { display: inline-block; padding: 4px 10px; background: var(--selected-bg); color: var(--primary); border-radius: 12px; font-size: 12px; font-weight: 700; }
    
    .badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .badge-shift-day { background: #fef3c7; color: #92400e; }
    .badge-shift-night { background: #e0e7ff; color: #3730a3; }
    .badge-payout { background: #fef9c3; color: #854d0e; }

    .status-alert { padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-size: 13px; font-weight: 600; display: none; line-height: 1.4; }
    .alert-danger { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    .alert-warning { background: #fef7e0; color: #b06000; border: 1px solid #feefc3; }
    .alert-success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 6000; align-items: center; justify-content: center; }
    .modal { background: white; padding: 20px; border-radius: 12px; max-width: 480px; width: 92%; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
    .modal-body { font-size: 13.5px; line-height: 1.5; color: #333; margin-bottom: 16px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .compare-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 14px; font-size: 12.5px; }
    .compare-item { display: flex; justify-content: space-between; padding: 4px 0; }
    .old-val { color: var(--danger); text-decoration: line-through; }
    .new-val { color: var(--success); font-weight: 700; }

    #toast { visibility: hidden; min-width: 280px; max-width: 90%; background-color: #323232; color: #fff; text-align: center; border-radius: 8px; padding: 12px 18px; position: fixed; z-index: 7000; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 14px; }
    #toast.show { visibility: visible; }
  </style>
</head>
<body>

  <!-- Универсальный баннер установки PWA -->
  <div class="pwa-top-bar" id="pwaTopBar">
    <span>📲 Приложение E-COM ПФЦ</span>
    <button type="button" class="btn-install-pwa" id="pwaGlobalInstallBtn" onclick="triggerPwaInstall()">Установить</button>
  </div>

  <!-- Авторизация по PIN -->
  <div id="authOverlay">
    <div class="auth-card">
      <div style="font-size: 38px; margin-bottom: 6px;">🔐</div>
      <div class="auth-title">E-COM ПФЦ</div>
      <div class="auth-subtitle">Введите персональный PIN-код</div>
      <form onsubmit="event.preventDefault(); verifyPin();">
        <input type="password" id="pinInput" class="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autofocus required>
        <button type="submit" class="btn btn-blue" style="width: 100%;">Войти</button>
      </form>
      <div id="authError" style="color: var(--danger); font-size: 13px; margin-top: 10px; font-weight: 600; display: none;">Неверный PIN-код!</div>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <div class="user-bar">
      <div>Роль: <b id="userRoleBadge" style="color:var(--primary);">—</b></div>
      <button type="button" class="btn-logout" onclick="logout()">Сменить роль ➔</button>
    </div>

    <!-- УРОВЕНЬ 1: ГЛАВНЫЕ МОДУЛИ -->
    <div class="module-nav">
      <button type="button" class="module-btn active" id="btnModuleSklad" onclick="switchModule('sklad')">🏭 СКЛАД МП</button>
      <button type="button" class="module-btn" id="btnModuleHr" onclick="switchModule('hr')">👥 HR / ПОДБОР</button>
    </div>

    <!-- УРОВЕНЬ 2: ПОДВКЛАДКИ СКЛАДА МП -->
    <div class="sub-nav-tabs" id="subTabsSklad">
      <div class="sub-nav-tab active" onclick="switchSubTab('kizTab', this)">📦 КИЗы</div>
      <div class="sub-nav-tab" onclick="switchSubTab('cameraTab', this)">🎥 Камеры</div>
      <div class="sub-nav-tab" onclick="switchSubTab('calcTab', this)">⚙️ Калькулятор</div>
    </div>

    <!-- УРОВЕНЬ 2: ПОДВКЛАДКИ HR -->
    <div class="sub-nav-tabs" id="subTabsHr" style="display: none;">
      <div class="sub-nav-tab active" onclick="switchSubTab('checkAdminTab', this)">📋 Чек-лист</div>
      <div class="sub-nav-tab" onclick="switchSubTab('referralTab', this)">🤝 Приведи друга</div>
      <div class="sub-nav-tab" onclick="switchSubTab('regTab', this)">📝 Запись на смену</div>
      <div class="sub-nav-tab" onclick="switchSubTab('shiftListTab', this)">📋 Список смены</div>
      <div class="sub-nav-tab" onclick="switchSubTab('staffTab', this)">👥 Смены и статусы</div>
    </div>

    <!-- ==================== ЭКРАНЫ СКЛАДА МП ==================== -->
    <!-- 1. КИЗЫ -->
    <div id="kizTab" class="tab-content active">
      <form id="kizForm" onsubmit="event.preventDefault(); submitKiz();">
        <div class="row-2">
          <div class="form-group"><label>Дата:</label><input type="date" id="kizDate" required></div>
          <div class="form-group"><label>Смена:</label><select id="kizShift" required><option value="день">☀️ День</option><option value="ночь">🌙 Ночь</option></select></div>
        </div>
        <div class="form-group">
          <label>Стол:</label>
          <div class="table-buttons-grid" id="kizTableButtons">
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(1, this)">1</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(2, this)">2</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(3, this)">3</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(4, this)">4</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(5, this)">5</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(6, this)">6</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(7, this)">7</button>
            <button type="button" class="c-btn-toggle" onclick="setSingleKizTable(8, this)">8</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(9, this)">9</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(10, this)">10</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(11, this)">11</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(12, this)">12</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(13, this)">13</button>
            <button type="button" class="btn-toggle" onclick="setSingleKizTable(14, this)">14</button>
          </div>
          <input type="hidden" id="selectedKizTable" value="">
        </div>
        <div class="form-group"><label>Поиск товара / ШК:</label><input type="text" id="kizSearchFilter" placeholder="Введите название или ШК..." oninput="onKizSearchInput(this.value)"></div>
        <div class="form-group"><label>Выбранный конструктор:</label><select id="kizConstructor"><option value="">-- Выберите из списка --</option></select></div>
        <div class="form-group"><label>Ссылка:</label><input type="text" id="kizLink" placeholder="https://max.ru/..."></div>
        <div class="form-group"><label>КИЗы:</label><textarea id="kizCodes" rows="5" placeholder="Вставьте КИЗы..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" style="flex:3;">✓ Добавить КИЗы</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="forceClearKizField()">✕</button>
        </div>
      </form>
    </div>

    <!-- 2. КАМЕРЫ -->
    <div id="cameraTab" class="tab-content">
      <form id="cameraForm" onsubmit="event.preventDefault(); submitCamera();">
        <div class="form-group"><label>Дата отсмотра:</label><input type="date" id="camDate" onchange="onDateChanged()" required></div>
        <div style="background:#e8f0fe; padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; font-weight:700;">
          <span style="color:#1967d2;">⏱️ Уже отсмотрено за дату:</span><span id="accumulatedTimeValue" style="color:#1a73e8;">00:00:00</span>
        </div>
        <div style="background:#f0f4f9; border:1px solid #c2e7ff; padding:12px; border-radius:8px; text-align:center; margin-bottom:12px;">
          <div id="timerDisplay" style="font-size:26px; font-weight:800; color:#1a73e8; margin-bottom:6px;">00:00:00</div>
          <button type="button" class="btn btn-primary" id="btnTimer" style="width:100%;" onclick="startTimer()">⏱ Начать отсмотр</button>
        </div>
        <div class="row-3">
          <div class="form-group"><label>Начало:</label><input type="text" id="camStartTime"></div>
          <div class="form-group"><label>Конец:</label><input type="text" id="camEndTime"></div>
          <div class="form-group"><label>Длительность:</label><input type="text" id="camDuration" readonly style="background:#f1f3f4;
